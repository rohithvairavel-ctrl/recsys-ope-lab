[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recsys-ope-lab"
version = "0.1.0"
description = "Recommender + off-policy evaluation lab: logging policies, retrieval/ranking, IPS/SNIPS/DR, overlap diagnostics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rohith Vairavel" }]
keywords = [
  "recommender-systems",
  "off-policy-evaluation",
  "IPS",
  "SNIPS",
  "doubly-robust",
  "propensity",
  "ranking",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
recsys-ope = "recsys_ope_lab.cli:main"

[project.urls]
Homepage = "https://github.com/rohithvairavel-ctrl/recsys-ope-lab"
Repository = "https://github.com/rohithvairavel-ctrl/recsys-ope-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
